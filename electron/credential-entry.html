<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>保存发布凭证</title>
  <style>
    body { margin: 0; padding: 24px; background: #1e1e1e; color: #eee; font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    p { color: #bbb; line-height: 1.5; }
    input { box-sizing: border-box; width: 100%; padding: 9px; border: 1px solid #555; border-radius: 4px; background: #2d2d2d; color: #fff; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    button { border: 0; border-radius: 4px; padding: 7px 14px; cursor: pointer; }
    #save { background: #0a9d58; color: #fff; }
  </style>
</head>
<body>
  <strong>保存发布凭证</strong>
  <p>凭证仅保存到本机安全存储，不会发送回发布面板。</p>
  <form id="credential-form">
    <input id="credential" type="password" autocomplete="off" autofocus>
    <div class="actions"><button type="button" id="cancel">取消</button><button id="save" type="submit">安全保存</button></div>
  </form>
  <script>
    const input = document.getElementById('credential');
    document.getElementById('credential-form').addEventListener('submit', event => {
      event.preventDefault();
      window.m2aCredentialEntry.submit(input.value);
    });
    document.getElementById('cancel').addEventListener('click', () => window.m2aCredentialEntry.cancel());
  </script>
</body>
</html>
