<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown2Anything — 网页版</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="vendor/github.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --m2a-accent: #f59e0b; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f5f4f0; color: #333; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    /* ── 标题栏 ── */
    .titlebar {
      display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      background: #252526; border-bottom: 1px solid #333; flex-shrink: 0;
    }
    .titlebar .logo { font-size: 14px; font-weight: 700; color: #f59e0b; white-space: nowrap; }
    .titlebar .logo small { font-weight: 400; color: #888; font-size: 11px; }
    .titlebar .spacer { flex: 1; }
    .btn {
      padding: 5px 12px; font-size: 12.5px; border-radius: 4px; border: 1px solid #444;
      background: #2d2d2d; color: #ddd; cursor: pointer; white-space: nowrap; transition: background .15s;
    }
    .btn:hover { background: #3a3a3a; }
    .btn.primary { background: #b45309; border-color: #92400e; color: #fff; font-weight: 600; }
    .btn.primary:hover { background: #c2410c; }
    .btn.accent { border-color: var(--m2a-accent); color: var(--m2a-accent); }
    .btn.accent:hover { background: rgba(245,158,11,.12); }
    select {
      padding: 4px 6px; border-radius: 4px; border: 1px solid #444; background: #2d2d2d;
      color: #eee; font-size: 12.5px; cursor: pointer; outline: none;
    }
    /* ── 主体 ── */
    .main { display: flex; flex: 1; min-height: 0; }
    .editor-pane {
      width: 46%; min-width: 300px; display: flex; flex-direction: column; border-right: 1px solid #ddd;
    }
    .editor-pane .pane-head {
      padding: 6px 12px; font-size: 11px; color: #888; background: #f0eee9; border-bottom: 1px solid #e2dfd8;
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .editor-pane .pane-head .stat { margin-left: auto; color: #666; }
    #editor-host { flex: 1; overflow: hidden; }
    #editor-host .cm-editor { height: 100%; font-size: 14px; background: #fff; color: #1a1a1a; }
    /* CodeMirror 浅色主题：白底深字，与预览一致，避免深色 UI 冲突 */
    #editor-host .cm-editor.cm-focused { outline: none; }
    #editor-host .cm-scroller { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.7; }
    #editor-host .cm-content { caret-color: #f59e0b; }
    #editor-host .cm-line { padding: 0 4px; }
    #editor-host .cm-activeLine { background: #faf7f0; }
    #editor-host .cm-gutters { background: #f7f7f5; color: #999; border-right: 1px solid #eee; }
    #editor-host .cm-activeLineGutter { background: #f0ece3; color: #666; }
    #editor-host .cm-selectionBackground { background: #cfe3f7 !important; }
    .preview-pane { flex: 1; display: flex; flex-direction: column; background: #fff; min-width: 0; }
    .preview-pane .pane-head {
      padding: 6px 12px; font-size: 11px; color: #888; background: #f0eee9; border-bottom: 1px solid #e2dfd8;
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .preview-pane .pane-head .title { color: #aaa; font-size: 12px; font-weight: 600; }
    #preview-scroll { flex: 1; overflow: auto; background: #fff; }
    .zoom-canvas { width: 100%; max-width: 70%; margin: 0 auto; }
    .article-wrapper { width: 100%; padding: 32px 28px; min-height: 100vh; }
    /* toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 999;
      background: #333; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px;
      box-shadow: 0 4px 20px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    #toast.show { opacity: 1; }
    /* 插入图片菜单 */
    .insert-menu {
      position: absolute; background: #252526; border: 1px solid #444; border-radius: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,.5); padding: 6px; display: none; z-index: 100; min-width: 160px;
    }
    .insert-menu .mi { padding: 7px 12px; font-size: 12.5px; color: #ddd; cursor: pointer; border-radius: 4px; }
    .insert-menu .mi:hover { background: #333; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="logo">Markdown2Anything <small>网页版 · v4.0</small></span>
    <select id="theme-select" title="切换主题"></select>
    <button class="btn" id="btn-insert-img">🖼 插入图片</button>
    <button class="btn" id="btn-copy-wechat">📋 复制微信</button>
    <button class="btn" id="btn-copy-zhihu">📋 复制知乎</button>
    <button class="btn" id="btn-export-xhs">📸 导出小红书长图</button>
    <span class="spacer"></span>
    <button class="btn" id="btn-open">📂 打开</button>
    <button class="btn" id="btn-download">💾 下载</button>
    <button class="btn" id="btn-new">🗑 清空</button>
  </div>

  <div class="main">
    <div class="editor-pane">
      <div class="pane-head">✏️ Markdown <span class="stat" id="word-count">0 字</span></div>
      <div id="editor-host"></div>
    </div>
    <div class="preview-pane">
      <div class="pane-head"><span class="title" id="doc-title">预览</span></div>
      <div id="preview-scroll"><div class="zoom-canvas"><div class="article-wrapper" id="preview-content"><p style="color:#999;text-align:center;">在左侧输入 Markdown，实时预览…</p></div></div></div>
    </div>
  </div>

  <div class="insert-menu" id="insert-menu">
    <div class="mi" data-act="file">🖼 选择本地图片</div>
    <div class="mi" data-act="url">🔗 粘贴图片 URL</div>
    <div class="mi" data-act="clipboard">📋 从剪贴板粘贴图片</div>
  </div>
  <input type="file" id="img-file" accept="image/*" style="display:none;">
  <div id="toast"></div>

  <script src="vendor/codemirror.bundle.js"></script>
  <script src="m2a-render.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
