appId: com.marsggbo.markdown2anything
productName: Markdown2Anything
copyright: MIT

directories:
  output: dist
  buildResources: build

files:
  - electron/**/*
  - lib/**/*
  - scripts/**/*
  - templates/**/*
  - web/**/*
  - package.json
  - node_modules/**/*
  - assets/**/*

mac:
  target:
    - dmg
    - zip
  icon: build/icon.png
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}

extraMetadata:
  main: electron/main.js

asar: true
asarUnpack:
  - scripts/xhs_screenshot.js
