name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 源码 + webview 语法与占位符检查
        run: node test/run.js syntax

  ui:
    name: UI 流程测试
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 安装 Playwright Chromium
        run: npx playwright-core install chromium --with-deps
      - name: 运行 UI 流程测试
        run: node test/run.js ui
